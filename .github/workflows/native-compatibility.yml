name: Native compatibility guard
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supervised/**'
      - 'tests/tests_utils/test_native_compatibility.py'
      - 'tests/checks/check_native_compatibility.py'
      - 'setup.py'
      - 'requirements.txt'
      - '.github/workflows/native-compatibility.yml'
jobs:
  guard:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'macOS'
        run: brew install libomp
      - run: python -m pip install . pytest psutil
      - run: python -m pip check
      - run: python -m pytest tests/tests_utils/test_native_compatibility.py -q
      - name: Installed base wheel, no Torch
        run: python tests/checks/check_native_compatibility.py base --output native-base
      - if: runner.os != 'macOS'
        run: python -m pip install 'torch==2.11.0' --index-url https://download.pytorch.org/whl/cpu
      - if: runner.os == 'macOS'
        run: python -m pip install 'torch==2.11.0'
      - run: python -m pip install '.[realmlp]'
      - name: Optional selection and import order in separate interpreters
        run: |
          python tests/checks/check_native_compatibility.py explicit --output native-explicit
          python tests/checks/check_native_compatibility.py torch-first --output native-torch-first
      - if: runner.os == 'macOS'
        run: python tests/checks/check_native_compatibility.py auto --output native-auto
