name: Test pip installation in a conda environment

on: 
  schedule:
    - cron:  '0 8 * * 1'
  # run workflow manually
  workflow_dispatch:
  
jobs:
  build:
    name: Run (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest] 
        python-version: ['3.11', '3.12']
    
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v2
        with:
          activate-environment: test
          auto-update-conda: false
          python-version: ${{ matrix.python-version }}
      - name: Activate conda and check versions
        run: |
          conda activate test
          conda --version
          python --version
      - name: Install MLJAR AutoML
        run: python -m pip install . pytest
      - name: Check base installation
        run: python -m pytest tests/tests_algorithms/test_package_installation.py -q
        env:
          MLJAR_TEST_BASE_INSTALL: '1'
      - name: Try to import
        run: python -c "import supervised;print(supervised.__version__)"
