name: Exported prediction apps
on:
  workflow_dispatch:
  push:
    paths:
      - 'supervised/apps/**'
      - 'supervised/preprocessing/**'
      - 'setup.py'
      - 'requirements.txt'
      - 'tests/**/test_app*.py'
      - 'tests/**/test_automl*app*.py'
      - 'tests/checks/check_app_runtime.py'
      - '.github/workflows/apps.yml'
  pull_request:
    paths:
      - 'supervised/apps/**'
      - 'supervised/preprocessing/**'
      - 'setup.py'
      - 'requirements.txt'
      - 'tests/**/test_app*.py'
      - 'tests/**/test_automl*app*.py'
      - 'tests/checks/check_app_runtime.py'
      - '.github/workflows/apps.yml'
jobs:
  apps:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'macOS'
        run: brew install libomp
      - name: Separate author and app environments
        shell: bash
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m venv author
          python -m venv runtime
          if [ "$RUNNER_OS" = "Windows" ]; then
            author_python=author/Scripts/python.exe
            runtime_python=runtime/Scripts/python.exe
          else
            author_python=author/bin/python
            runtime_python=runtime/bin/python
          fi
          "$author_python" -m pip install dist/*.whl
          "$author_python" tests/checks/check_app_runtime.py export app-smoke
          "$runtime_python" -m pip install dist/*.whl pytest
          "$runtime_python" -m pip install -r app-smoke/discovery/requirements.txt
          "$runtime_python" -m pip check
          "$runtime_python" -m pytest tests/tests_automl/test_app_dependencies.py tests/tests_automl/test_automl_app.py tests/tests_automl/test_automl_local_app.py tests/tests_algorithms/test_package_installation.py -q
          "$runtime_python" tests/checks/check_app_runtime.py run app-smoke
