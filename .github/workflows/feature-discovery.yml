name: Feature discovery

on: [push, pull_request]

jobs:
  feature-discovery:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: python -m pip install -e '.[feature-discovery]' pytest
      - run: >-
          pytest -q tests/tests_preprocessing/test_feature_discovery.py
          tests/tests_tuner/test_feature_discovery.py
          tests/tests_automl/test_feature_discovery.py
