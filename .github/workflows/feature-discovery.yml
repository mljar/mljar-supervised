name: Feature discovery

on: [push, pull_request]

jobs:
  feature-discovery:
    runs-on: ${{ matrix.os }}
    env:
      MLJAR_TEST_BASE_INSTALL: '1'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - if: runner.os == 'macOS'
        run: brew install graphviz libomp
      - if: runner.os == 'Windows'
        run: choco install graphviz
      - run: python -m pip install . pytest
      - run: python -m pip check
      - run: >-
          pytest -q tests/tests_algorithms/test_package_installation.py tests/tests_preprocessing/test_feature_discovery.py
          tests/tests_tuner/test_feature_discovery.py
          tests/tests_automl/test_feature_discovery.py
